<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <body>
    <div id="app">
      <header>
        <input id="title" type="text" placeholder="Tier list title…" autocomplete="off" />

          <button id="share" class="btn" type="button">Share</button>
          <button id="copy" class="btn primary" type="button">Copy link</button>
        </div>
      </header>

      <form id="add-form">
        <input
          id="add-input"
          type="text"
          placeholder="Add an item… (include a URL to make it a link)"

        />
        <button class="btn" type="submit">Add</button>
      </form>

      <main id="board"></main>

      <footer>
        <span id="url-status"></span>
      </footer>

      <div id="toast" class="toast hidden"></div>
    </div>
  </body>
